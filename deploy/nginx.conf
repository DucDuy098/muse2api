# Muse2API Studio — Nginx config for the team web app.
#
# Layout:
#   - Next.js static export (frontend/out) served directly as files, no Node
#     process — the 4GB VPS budget goes to Chromium + Postgres, not a second
#     JS runtime.
#   - FastAPI (uvicorn, 127.0.0.1:18610) proxied for /v1, /admin, /auth,
#     /healthz, /readyz.
#   - auth_request gates every static page except /login behind a valid
#     session cookie, so an unauthenticated browser never receives the
#     protected HTML/JS bundle at all (not just a client-side redirect).
#
# Adjust server_name / cert paths / the `root` directories for your box, then:
#   sudo certbot --nginx -d app.yourdomain.com
# to obtain and wire up the TLS certs (not scripted here — requires live DNS).

upstream muse2api_backend {
    server 127.0.0.1:18610;
}

server {
    listen 80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    # ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    root /opt/muse2api/frontend/out;

    # --- Auth gate for the static UI ---------------------------------
    location = /auth_check {
        internal;
        proxy_pass http://muse2api_backend/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Login page and its JS/CSS chunks must stay reachable while logged out.
    location = /login {
        try_files /login.html =404;
    }
    location = /login.html {
        try_files $uri =404;
    }
    location /_next/ {
        try_files $uri =404;
    }
    location /favicon.ico {
        try_files $uri =404;
    }

    # --- FastAPI ---------------------------------------------------------
    location /healthz { proxy_pass http://muse2api_backend; }
    location /readyz   { proxy_pass http://muse2api_backend; }

    location /auth/ {
        proxy_pass http://muse2api_backend;
        proxy_set_header Cookie $http_cookie;
    }

    location /v1/ {
        proxy_pass http://muse2api_backend;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 650s;   # must exceed MUSE2API_VIDEO_TIMEOUT
        proxy_buffering off;      # /v1/chat/completions streams SSE
    }

    location /admin/ {
        auth_request /auth_check;
        proxy_pass http://muse2api_backend;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 650s;
        proxy_buffering off;      # /admin/tasks/{id}/stream streams SSE
        proxy_set_header X-Accel-Buffering no;
    }

    # --- Everything else: static export, auth-gated --------------------
    location / {
        auth_request /auth_check;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 401 = @unauthorized;
    location @unauthorized {
        return 302 /login;
    }
}
